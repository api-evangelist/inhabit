aid: inhabit
name: Inhabit
description: Inhabit is a global PropTech software company operating a portfolio of specialized
  platforms for the residential and vacation rental property management markets, including ResMan,
  Streamline, LiveRez, Anyone Home, ResidentIQ, ePremium, Rental Guardian, Lynnbrook Group payments,
  Western Reporting screening, and Bluetent marketing. Its integrated tools span property management,
  resident and guest CRM and contact center, payments processing, renters and property insurance,
  tenant screening and income verification, utility billing, and marketing websites, serving
  multifamily, single-family, student, affordable, HOA and condo, and short-term vacation rental
  operators worldwide. Backed by Insight Partners.
